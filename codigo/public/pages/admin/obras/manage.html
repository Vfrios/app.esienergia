<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Gerenciar Obras | Sistema ESI</title>
    <link rel="icon" type="image/png" href="https://esienergia.com.br/wp-content/uploads/2024/02/favicon5.png">
    <link rel="stylesheet" href="/public/static/01_Create_Obra/main.css">
    <style>
        .manage-obras-filter {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--border-radius-lg);
            background: var(--bg-primary);
            box-shadow: var(--card-shadow);
        }

        .manage-obras-filter[hidden] {
            display: none;
        }

        .manage-obras-filter-field {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .manage-obras-filter-field label {
            color: var(--color-gray-700);
            font-size: 12px;
            font-weight: 600;
        }

        .manage-obras-filter-field input {
            width: 100%;
            box-sizing: border-box;
            padding: var(--spacing-sm);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--border-radius);
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 13px;
        }

        .manage-obras-filter-field {
            position: relative;
        }

        .manage-obras-company-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 1000;
            display: none;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid var(--color-gray-300);
            border-radius: var(--border-radius);
            background: var(--bg-primary);
            box-shadow: 0 8px 18px rgba(15, 23, 42, .14);
        }

        .manage-obras-company-option {
            display: block;
            width: 100%;
            padding: 9px 10px;
            border: 0;
            background: transparent;
            color: var(--color-gray-700);
            cursor: pointer;
            font: inherit;
            text-align: left;
        }

        .manage-obras-company-option:hover,
        .manage-obras-company-option.is-active {
            background: var(--color-gray-100);
        }

        @media (max-width: 900px) {
            .manage-obras-filter {
                grid-template-columns: 1fr;
            }
        }

        .manage-obras-page .price-display,
        .manage-obras-page .obra-total-value,
        .manage-obras-page .project-total-value,
        .manage-obras-page [id*="price" i],
        .manage-obras-page [id*="valor" i],
        .manage-obras-page .input-valor {
            visibility: hidden;
        }

        .obra-history {
            margin: var(--spacing-lg) 0;
            color: var(--color-gray-700);
        }

        .obra-history-open {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 var(--spacing-lg);
            border: 1px solid #b6bbc3;
            border-radius: 6px;
            padding: 10px 16px;
            background: #f3f4f6;
            color: #5f6670;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .08);
            transition: background .2s ease, border-color .2s ease, color .2s ease;
        }

        .obra-history-open:hover {
            border-color: #8f96a0;
            background: #e5e7eb;
            color: #374151;
        }

        .saved-obras-title {
            margin: 0 0 var(--spacing-md);
            color: var(--color-gray-700);
            font-size: 1.25rem;
        }

        .obra-history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .obra-history-title {
            margin: 0;
            color: #6b7280;
            font-size: 1.25rem;
        }

        .obra-history-back {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 8px 12px;
            background: #f9fafb;
            color: #6b7280;
            cursor: pointer;
            font: inherit;
        }

        .obra-history-back:hover { background: #f3f4f6; color: #374151; }

        .obra-history-filter {
            max-width: 420px;
            margin-bottom: var(--spacing-md);
        }

        .obra-history-list {
            display: grid;
            gap: 18px;
        }

        .obra-history-company {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin: 0;
            padding: 16px 18px;
            border: 0;
            background: #1e293b;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            text-align: left;
        }

        .obra-history-company:hover { background: #334155; }
        .obra-history-company-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            line-height: 1;
        }

        .obra-history-group {
            margin-bottom: var(--spacing-xl);
            border: 1px solid var(--color-gray-light);
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .obra-history-group:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--card-hover-shadow);
        }

        .obra-history-company-items {
            display: grid;
            gap: 12px;
            padding: 14px;
        }
        .obra-history-company-items[hidden],
        .obra-history-versions[hidden] { display: none; }

        .obra-history-obra-group {
            margin: 0 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }
        .obra-history-obra {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            border: 0;
            padding: 12px 14px;
            background: #f1f5f9;
            color: #1e293b;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            text-align: left;
        }
        .obra-history-obra:hover { color: #374151; }
        .obra-history-obra-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: #6b7280;
            font-size: 16px;
        }
        .obra-history-versions {
            display: grid;
            gap: 12px;
            padding: 14px;
        }

        .obra-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f8fafc;
        }

        .obra-history-item-info { min-width: 0; }
        .obra-history-item-name { margin: 0 0 4px; font-weight: 600; }
        .obra-history-item-meta { margin: 0; color: var(--color-gray-600); font-size: 12px; }
        .obra-history-files { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
        .obra-history-file, .obra-history-delete {
            border: 0;
            border-radius: var(--border-radius);
            padding: 6px 9px;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }
        .obra-history-file { background: var(--color-gray-100); color: var(--color-gray-700); text-decoration: none; }
        .obra-history-delete { background: #fee2e2; color: #991b1b; }

        @media (max-width: 700px) {
            .obra-history-item { align-items: flex-start; flex-direction: column; }
            .obra-history-files { justify-content: flex-start; }
        }
    </style>
</head>

<body class="manage-obras-page">
    <header class="header">
        <div class="header-left">
            <img src="https://esienergia.com.br/wp-content/uploads/2023/08/logo-esienergia-white.png"
                alt="Logo Esquerda" class="logo">
        </div>
        <div class="header-center">
            <h1 id="page-title">Gerenciar Obras</h1>
        </div>
        <button class="shutdown-btn" onclick="shutdownManual()" title="Encerrar Servidor">
            Encerrar Servidor
        </button>
    </header>

    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="/admin/obras/create" id="nav-criar-obras">Criar Obras</a></li>
            <li><a href="/admin/obras/manage" id="nav-gerenciar-obras" class="active" data-current-page="true">Gerenciar Obras</a></li>
            <li><a href="/admin/data" id="nav-editar-dados">Editar dados</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="container">
            <h2 class="saved-obras-title" id="saved-obras-title">Obras salvas</h2>
            <div class="manage-obras-filter" role="search" aria-label="Filtrar obras">
                <div class="manage-obras-filter-field">
                    <label for="manage-obras-filter-empresa">Empresa</label>
                    <input type="search" id="manage-obras-filter-empresa" placeholder="Empresa" autocomplete="off">
                    <div id="manage-obras-filter-empresa-dropdown" class="manage-obras-company-dropdown" role="listbox"></div>
                </div>
                <div class="manage-obras-filter-field">
                    <label for="manage-obras-filter-numero-cliente">Nº cliente</label>
                    <input type="search" id="manage-obras-filter-numero-cliente" placeholder="Nº cliente" inputmode="numeric" autocomplete="off">
                </div>
                <div class="manage-obras-filter-field">
                    <label for="manage-obras-filter-nome-obra">Nome da obra</label>
                    <input type="search" id="manage-obras-filter-nome-obra" placeholder="Nome da obra" autocomplete="off">
                </div>
            </div>

            <button type="button" class="obra-history-open" id="open-obra-history">🕘 Histórico de obras</button>

            <section class="obra-history" id="obra-history-panel" aria-labelledby="obra-history-title" hidden>
                <div class="obra-history-header">
                    <button type="button" class="obra-history-back" id="back-to-managed-obras">← Voltar ao gerenciamento</button>
                    <h2 class="obra-history-title" id="obra-history-title">🕘 Histórico de obras</h2>
                </div>
                <div class="manage-obras-filter-field obra-history-filter">
                    <label for="obra-history-filter-empresa">Empresa</label>
                    <input type="search" id="obra-history-filter-empresa" placeholder="Empresa" autocomplete="off">
                    <div id="obra-history-filter-empresa-dropdown" class="manage-obras-company-dropdown" role="listbox"></div>
                </div>
                <div id="obra-history-list" class="obra-history-list" aria-live="polite"></div>
            </section>

            <div id="projects-container">
                <!-- Hierarquia: Obra -> Projeto -> Sala -->
            </div>
        </div>
    </main>

    <div id="confirmationModal" class="confirmation-modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Remover da Visualização</h2>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="window.closeConfirmationModal()">Manter</button>
                <button class="modal-btn btn-confirm" onclick="window.confirmDeletion()">Remover</button>
            </div>
        </div>
    </div>

    <footer>
        <a href="https://github.com/Vfrios" target="_blank" rel="noopener">
            <i class="fa-brands fa-github"></i> Vitor Rios on GitHub
        </a>
    </footer>

    <script type="module" src="/public/scripts/01_Create_Obra/pages/create-obras-page.js"></script>
    <script type="module" src="/public/scripts/01_Create_Obra/pages/manage-obras-filter.js"></script>
    <script type="module" src="/public/scripts/01_Create_Obra/pages/obra-history.js"></script>
    <script type="module" src="/public/scripts/01_Create_Obra/pages/manage-obras-visibility.js?v=20260906-1"></script>
    <script type="module" src="/public/scripts/01_Create_Obra/main.js"></script>
</body>
</html>
